# Dependabot for sample-data, from the template in revenexx/.github (DX-93,
# DX-660). Two things here are pinned: the terminal UI's npm packages, by
# tui/package-lock.json, and the actions in the workflows. The loader is bash,
# curl and jq, and the Python and Node build tools in tools/ have no manifest,
# so there is nothing of theirs to bump.
#
# Security updates are a repository setting, not something declared here; the
# `npm-security` group below only bundles them. Version updates come weekly,
# one pull request per ecosystem, majors included (DX-704). A group that turns
# red gets `@dependabot ignore <package> major version` and a ticket for the
# package.
version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/tui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # The types follow the Node release CI runs (22), not ahead of it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint 8 accepts TypeScript below 6.1 only; with 7 the
      # install fails (ERESOLVE). DX-705 lifts this once typescript-eslint
      # takes 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm:
        applies-to: version-updates
        patterns: ["*"]

  # Third-party actions; where a workflow names one by major tag (`@v4`), every
  # update is a major. Our own reusable workflows (revenexx/.github, @v1)
  # are not touched: they move by their tag. ci.yml calls none of them yet,
  # since this repository is public; the ignore is for the day it can.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    ignore:
      - dependency-name: "revenexx/.github"
      - dependency-name: "revenexx/.github/*"
      - dependency-name: "revenexx/.github/**"
    groups:
      actions:
        patterns: ["*"]
